name: Render Assignment 2 HTML

on:
  push:
    branches: [main]
    paths:
      - "DSA295_003_FA26_A2_sryan3.Rmd"
      - ".github/workflows/render-a2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install R packages
        run: Rscript -e 'install.packages(c("igraph","ggraph","knitr","rmarkdown"), repos="https://cloud.r-project.org")'
      - name: Render HTML
        run: Rscript -e 'rmarkdown::render("DSA295_003_FA26_A2_sryan3.Rmd", output_file="DSA295_003_FA26_A2_sryan3.html")'
      - name: Commit rendered HTML
        run: |
          if git diff --quiet -- DSA295_003_FA26_A2_sryan3.html; then
            echo "No HTML changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DSA295_003_FA26_A2_sryan3.html
          git commit -m "Render updated Assignment 2 HTML"
          git push
